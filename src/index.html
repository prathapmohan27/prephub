<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="utf-8" />
    <title>PrepHub</title>
    <meta
      name="description"
      content="Interview prep for Angular and Node.js developers: Q&amp;A with model answers, mock interviews, daily practice, core concepts and system design."
    />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="favicon.png" />
    <meta name="theme-color" content="#09090b" />
    <!-- Set the theme before first paint (ThemeService takes over once the app boots) -->
    <script>
      (function () {
        var theme = 'dark';
        try {
          var saved = localStorage.getItem('prep_theme');
          theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
        if (theme === 'light') {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f5f5f7');
        }
      })();
    </script>

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"
    />
  </head>

  <body class="h-full antialiased">
    <app-root></app-root>
  </body>
</html>
